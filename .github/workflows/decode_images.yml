name: Decode Staged Carousel Images

on:
  push:
    paths:
      - 'staging/*.json'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gdown

      - name: Fetch or decode staged slides into docs/images
        run: |
          python3 - <<'EOF'
          import base64, glob, json, os, subprocess

          for path in sorted(glob.glob("staging/*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              batch = data["batch"]
              out_dir = os.path.join("docs", "images", batch)
              os.makedirs(out_dir, exist_ok=True)
              filenames = []

              for filename, val in data.get("slides", {}).items():
                  out_path = os.path.join(out_dir, filename)
                  if isinstance(val, dict) and val.get("drive_id"):
                      subprocess.run(
                          ["gdown", "--id", val["drive_id"], "-O", out_path],
                          check=True,
                      )
                  else:
                      with open(out_path, "wb") as img:
                          img.write(base64.b64decode(val))
                  filenames.append(filename)

              manifest_path = os.path.join(out_dir, "manifest.json")
              with open(manifest_path, "w", encoding="utf-8") as mf:
                  json.dump({
                      "batch": batch,
                      "caption": data.get("caption", ""),
                      "slides": [
                          f"https://swaltnuscord-sketch.github.io/thriving-allegedly-image-host/images/{batch}/{fn}"
                          for fn in filenames
                      ]
                  }, mf, indent=2)
              os.remove(path)
          EOF

      - name: Commit decoded images and remove staging bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Host staged carousel images in docs/images"
          git push
